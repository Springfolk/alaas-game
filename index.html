<style>
  /* Interface look (docs/ui.md): Windows Vista / Live Messenger era — Aero glass frames, light "client" areas,
     glossy pills. The glass is drawn (tint, gloss band, streaks, bright edge): no backdrop blur anywhere.
     Blue = looking closer (inspect); green = the hands (do); gold = a place to go to. */
  :root {
    --ink: #f4f8fc; --dim: rgba(228, 240, 252, 0.78);
    --live: #2a8ae0; --live-d: #1a5fa8; --live-l: #8fd6ff; --orb: #4cbb2a; --glow: 110, 200, 255;
    --read: 64, 150, 232; --act: 78, 178, 52; --gold: #ffd77a;
    --edge: rgba(255, 255, 255, 0.5);
    --client: #f8fbff; --c-ink: #1b2a3a; --c-dim: #55697d; --c-line: #cfdcea; --c-head: #1e4f8a;
    --sans: 'Open Sans', 'Segoe UI', system-ui, sans-serif; --serif: 'Noto Serif', Georgia, serif;
    --ease: cubic-bezier(.2, .8, .25, 1);
    --ui: 1; /* interface scale on big screens (src/ui/ui.js `fit`): every surface carries `zoom: var(--ui)` */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; background: #0b1520; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .layer { position: fixed; inset: 0; display: none; }
  .layer.show { display: flex; }
  .ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.28em; }

  /* ---- Aero glass: a frame of tinted glass with a gloss band and streaks ---- */
  .glass {
    position: relative; border: 1px solid var(--edge); border-radius: 11px;
    background:
      linear-gradient(112deg, transparent 18%, rgba(255,255,255,.08) 24%, transparent 31%, transparent 58%, rgba(255,255,255,.06) 63%, transparent 69%),
      linear-gradient(180deg, rgba(255,255,255,.36) 0, rgba(255,255,255,.13) 40px, rgba(255,255,255,.02) 42px, rgba(255,255,255,.07) 100%),
      linear-gradient(160deg, rgba(52,104,150,.9), rgba(20,50,82,.9) 55%, rgba(30,78,116,.9));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(255,255,255,.08), 0 0 0 1px rgba(0,12,28,.55), 0 12px 34px rgba(0,0,0,.42);
  }
  /* a small pane of the same glass for the things set on the view (prompt, beats, hints) */
  .pane {
    border: 1px solid rgba(255,255,255,.55); border-radius: 10px; color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.3) 0, rgba(255,255,255,.1) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.08) 100%), rgba(18,46,76,.74);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 0 1px rgba(0,12,28,.5), 0 3px 10px rgba(0,0,0,.35);
  }
  .win { display: flex; flex-direction: column; padding: 0 7px 7px; color: var(--ink); }
  .win-head { position: relative; display: flex; align-items: center; gap: 10px; padding: 11px 12px 10px; text-shadow: 0 0 12px rgba(0,20,50,.9), 0 1px 2px rgba(0,10,30,.8); }
  .win-head h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; margin: 0; line-height: 1.15; }
  .client {
    position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    background: var(--client); color: var(--c-ink); border-radius: 5px; border: 1px solid rgba(10,30,60,.5);
    box-shadow: 0 0 0 1px rgba(255,255,255,.35), inset 0 1px 3px rgba(0,30,70,.12);
    padding: 16px 20px 14px; line-height: 1.6; font-size: 14.5px; -webkit-overflow-scrolling: touch;
  }
  .client::-webkit-scrollbar { width: 12px; }
  .client::-webkit-scrollbar-track { background: linear-gradient(90deg, #e9eef3, #f7f9fb); border-left: 1px solid #dde5ee; }
  .client::-webkit-scrollbar-thumb { border-radius: 6px; border: 2px solid transparent; background-clip: padding-box;
    background-color: #b9cde3; background-image: linear-gradient(90deg, rgba(255,255,255,.7), rgba(255,255,255,0) 60%); }

  /* glossy buttons: a split gloss over a gradient, blue glow on hover, sunk when pressed */
  .btn, .chip, .sel-btn {
    position: relative; font: 500 13.5px var(--sans); color: #12263c; cursor: pointer; border-radius: 999px;
    padding: 6px 16px; border: 1px solid #6f8aa8; text-decoration: none;
    background: linear-gradient(180deg, #fdfeff 0%, #eef4fa 48%, #dbe6f1 52%, #e9f1f9 100%);
    box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.6), 0 1px 2px rgba(0,20,50,.25);
  }
  .btn:hover, .chip:hover, .sel-btn:hover, .btn.vh, .chip.vh:not(.unknown), .sel-btn.vh, .sel.open .sel-btn { /* .vh / .vdown: hover and press under the drawn cursor (src/ui/cursor.js) */
    border-color: #3c7fb1; background: linear-gradient(180deg, #f4fbff 0%, #def1fd 48%, #bfe3f9 52%, #d7f0fd 100%);
    box-shadow: inset 0 1px 0 #fff, 0 0 9px rgba(var(--glow),.75), 0 1px 2px rgba(0,20,50,.25);
  }
  .btn:active, .chip:active, .sel-btn:active, .btn.vdown, .chip.vdown, .sel-btn.vdown {
    background: linear-gradient(180deg, #cde6f7 0%, #b3d9f3 48%, #98c8ea 52%, #b5dcf5 100%); box-shadow: inset 0 2px 4px rgba(0,30,70,.35); }
  .btn.primary {
    color: #fff; text-shadow: 0 1px 2px rgba(0,30,70,.7); border-color: #134a85; font-weight: 600;
    background: linear-gradient(180deg, #8ccdf7 0%, #3d9ae3 48%, #1f78c8 52%, #3a9ae6 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -6px 12px rgba(var(--glow),.45), 0 2px 8px rgba(0,20,60,.45);
  }
  .btn.primary:hover, .btn.primary.vh { background: linear-gradient(180deg, #a6dafa 0%, #52aaee 48%, #2a88d9 52%, #4fb0f2 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -6px 14px rgba(var(--glow),.6), 0 0 18px rgba(var(--glow),.8); }
  .orb { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; vertical-align: -1px;
    background: radial-gradient(circle at 50% 30%, #f2ffe8 0, #9be36f 30%, var(--orb) 62%, #237a10 100%); box-shadow: 0 0 0 1px rgba(20,70,10,.55), 0 0 6px rgba(120,230,80,.6); }
  kbd, .key { display: inline-block; font: 600 12px var(--sans); color: #1a2c40; border: 1px solid #7d91a8; border-radius: 5px; padding: 1px 7px; min-width: 22px; text-align: center; white-space: nowrap;
    background: linear-gradient(180deg, #fff 0%, #eef2f6 50%, #dde4ec 51%, #edf1f5 100%); box-shadow: inset 0 1px 0 #fff, 0 1px 0 rgba(0,20,50,.35); text-shadow: none; }
  .mouse { width: 13px; height: 19px; flex: none; color: #1a2c40; vertical-align: -4px; }
  /* the red caption close button, on every window */
  .win-close { position: absolute; top: -1px; right: 10px; width: 46px; height: 22px; padding: 0; z-index: 3; cursor: pointer; border: 1px solid rgba(60,0,0,.75); border-top: 0; border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, #e9a99a 0%, #d0533b 45%, #b5280f 52%, #d24c2c 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(255,255,255,.18), 0 1px 3px rgba(0,0,0,.35); }
  .win-close::before, .win-close::after { content: ''; position: absolute; left: 50%; top: 50%; width: 13px; height: 2.4px; margin: -1.2px 0 0 -6.5px; border-radius: 1px; background: #fff; box-shadow: 0 0 2px rgba(80,0,0,.9); transform: rotate(45deg); }
  .win-close::after { transform: rotate(-45deg); }
  .win-close:hover, .win-close.vh { background: linear-gradient(180deg, #f6c0b0 0%, #e8654a 45%, #d2361a 52%, #f06a45 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(255,120,80,.9); }
  .win-close:active, .win-close.vdown { background: linear-gradient(180deg, #b84a35, #8f1f0b); }

  /* ---- a select (src/ui/select.js): the current choice on a button, the choices in a list that drops from it ---- */
  .sel { position: relative; display: inline-block; }
  .sel-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px 6px 12px; border-radius: 6px; min-width: 132px; }
  .sel-btn .cur { flex: 1; text-align: left; }
  .sel-btn .ic { width: 15px; height: 15px; }
  .sel-menu { display: none; position: absolute; z-index: 5; left: 0; min-width: 100%; top: calc(100% + 3px); padding: 4px; border-radius: 7px; border: 1px solid #5f7a98; background: #f8fbff; box-shadow: 0 6px 18px rgba(0,20,50,.45); }
  .sel.up .sel-menu { top: auto; bottom: calc(100% + 3px); }
  .sel.open .sel-menu { display: block; }
  .sel-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px 7px 8px; border: 0; border-radius: 4px; background: none; cursor: pointer; font: 500 13.5px var(--sans); color: #12263c; text-align: left; white-space: nowrap; }
  .sel-menu button .ic { width: 15px; height: 15px; stroke-width: 3; color: transparent; }
  .sel-menu button.on { font-weight: 700; color: var(--c-head); }
  .sel-menu button.on .ic { color: #2a8ae0; }
  .sel-menu button:hover, .sel-menu button.vh { background: #d9edfc; }
  .sel-lbl { display: inline-flex; align-items: center; gap: 7px; }

  /* ---- title: the name on the key art, a glass dock with the loading bar, then the start button and the language ---- */
  #title { z-index: 20; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px max(4vh, 16px); cursor: pointer; text-align: center;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(4,14,26,.55), rgba(4,14,26,0) 70%); }
  #title h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(60px, 11vw, 190px); margin: 0; letter-spacing: .02em; line-height: 1.05;
    color: #fff; text-shadow: 0 0 28px rgba(var(--glow),.55), 0 0 2px rgba(255,255,255,.9), 0 3px 26px rgba(0,10,30,.55); animation: rise 1.4s var(--ease) both; }
  #title .sub { font-family: var(--serif); font-style: italic; color: var(--dim); font-size: clamp(15px, 1.6vw, 30px); margin: 2px 0 18px; text-shadow: 0 1px 8px rgba(0,10,30,.8); animation: rise 1.4s .15s var(--ease) both; }
  #title .dock { zoom: var(--ui); width: min(380px, 100%); display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding: 16px 18px 14px; cursor: default; animation: rise 1.2s .3s var(--ease) both; }
  .load { display: flex; flex-direction: column; gap: 7px; }
  #title.ready .load { display: none; }
  .bar { height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid rgba(0,20,50,.6); background: linear-gradient(180deg, rgba(0,20,50,.5), rgba(0,20,50,.28)); box-shadow: inset 0 1px 3px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.3); }
  .bar i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); transition: width .35s linear; border-radius: 6px;
    background: linear-gradient(180deg, #c8f5a8 0%, #6fd43c 48%, #3fae18 52%, #62cc34 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
  #title.error .bar i { background: #e0453a; }
  .load .status { font-size: 12.5px; letter-spacing: .04em; color: var(--ink); text-shadow: 0 1px 4px rgba(0,10,30,.8); min-height: 1.4em; text-align: center; }
  #title.error .status { color: #ffd3cf; }
  .start { display: none; align-items: center; justify-content: center; gap: 10px; font-size: 18px; padding: 12px 24px; min-height: 50px; cursor: pointer; }
  #title.ready .start { display: flex; animation: pop .6s var(--ease) both; }
  .start .orb { width: 18px; height: 18px; animation: breathe 2.6s ease-in-out infinite; }
  .lang-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--ink); text-shadow: 0 1px 3px rgba(0,10,30,.8); }
  /* studio mark (Springfolk brand: dark-background lockup, unaltered, on a soft dark corner) and the links row */
  #title::before { content: ''; position: absolute; left: 0; top: 0; width: 360px; height: 180px; pointer-events: none;
    background: radial-gradient(ellipse at 0 0, rgba(4,14,26,.55), rgba(4,14,26,0) 70%); }
  .studio { position: absolute; left: max(20px, 2.2vw); top: max(18px, 2.2vw); display: block; line-height: 0; animation: fadein 1.4s .5s both; }
  .studio img { height: clamp(26px, 3.2vw, 60px); width: auto; }
  .links { zoom: var(--ui); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--dim);
    text-shadow: 0 1px 4px rgba(0,10,30,.8); cursor: default; animation: rise 1.2s .45s var(--ease) both; }
  .links a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(228,240,252,.35); }
  .links a:hover { border-bottom-color: var(--ink); }
  .links .issue { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(246,178,74,.75);
    background: rgba(40,24,4,.55); color: #ffe2b0; font-weight: 600; text-shadow: none; }
  .links .issue:hover { background: rgba(70,42,6,.7); border-color: #f6b24a; }
  .links .issue::before { content: '!'; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: #f6b24a; color: #3a2400; font-size: 11px; font-weight: 800; }

  /* ---- crosshair + look prompt: the thing's name under the dot; looking closer (blue lens, E) to its left,
     what the hands would do (green plate, its own tool, the mouse) to its right ---- */
  #dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 3px rgba(0,0,0,.6); pointer-events: none; } /* its states switch at once: animated, a frame came late after a state change */
  #dot.on { transform: scale(2); background: #dff4ff; box-shadow: 0 0 0 1px rgba(20,90,160,.6), 0 0 8px rgba(var(--glow),.95); }
  #dot.do { transform: scale(3.5); background: rgba(210,255,190,.14); box-shadow: 0 0 0 .5px #eaffdc, 0 0 5px rgba(140,240,110,.9); } /* the hands can do something here: a ring */
  .carded #dot { display: none; }
  #prompt { position: fixed; z-index: 4; left: 50%; top: 50%; width: 0; height: 0; zoom: var(--ui); pointer-events: none; display: none; color: #fff; } /* shown and hidden at once: no animation */
  #prompt.show { display: block; }
  .p-name { position: absolute; left: 0; top: 34px; transform: translateX(-50%); max-width: 92vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 600 17px var(--sans); text-shadow: 0 1px 2px rgba(0,8,20,.95), 0 0 10px rgba(0,8,20,.9); }
  .p-read, .p-act { position: absolute; top: -20px; width: max-content; display: none; align-items: center; }
  .has-read .p-read, .has-act .p-act { display: flex; }
  .p-read { right: 30px; gap: 6px; }
  .p-read .lens { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.75);
    background: linear-gradient(180deg, rgba(255,255,255,.5) 0, rgba(255,255,255,.12) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.16) 100%), rgb(var(--read));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 1px rgba(0,30,70,.6), 0 2px 8px rgba(0,0,0,.4); }
  .p-read .ic { width: 22px; height: 22px; }
  .p-act { left: 30px; gap: 8px; min-height: 40px; padding: 4px 10px 4px 4px; border-radius: 9px; border: 1px solid rgba(255,255,255,.7);
    background: linear-gradient(180deg, rgba(255,255,255,.34) 0, rgba(255,255,255,.1) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.1) 100%), rgba(22,74,20,.86);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(0,30,0,.6), 0 2px 8px rgba(0,0,0,.4); }
  .p-act .tool { width: 30px; height: 30px; flex: none; border-radius: 6px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.6);
    background: linear-gradient(180deg, #a5e88a 0%, #5cc23a 48%, #3a9c1c 52%, #56bd34 100%); }
  .p-act .tool .ic { width: 21px; height: 21px; color: #fff; stroke-width: 2.2; }
  .p-act .verb { font: 600 14px/1.2 var(--sans); max-width: min(250px, calc(50vw / var(--ui) - 104px)); text-shadow: 0 1px 2px rgba(0,20,0,.9); }
  .p-act .verb:empty { display: none; }
  .p-key { display: flex; align-items: center; gap: 3px; }
  .p-key .hold { display: none; width: 16px; height: 5px; border-radius: 3px; background: #1a2c40; }
  .held .p-key .hold { display: block; } /* a bar beside the glyph: keep it held */
  .p-act .p-key { padding: 2px 5px; border-radius: 5px; background: linear-gradient(180deg, #fff, #dde4ec); border: 1px solid #7d91a8; }
  /* what is carried can be put down: by the hands, low on the right */
  #puthint { position: fixed; z-index: 4; right: 19vw; bottom: 9vh; zoom: var(--ui); display: none; align-items: center; gap: 7px; padding: 5px 7px 5px 9px; }
  #puthint.show { display: flex; }
  #puthint .ic { width: 20px; height: 20px; }
  #puthint .p-key { padding: 2px 5px; border-radius: 5px; background: linear-gradient(180deg, #fff, #dde4ec); border: 1px solid #7d91a8; }
  /* a choice of ribbons under the look (yard/bits.js `choose`): strips of their colour, the picked one lifted */
  #choice { position: fixed; z-index: 20; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); display: none; gap: 16px; align-items: flex-start; }
  #choice.show { display: flex; }
  #choice button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 64px; padding: 6px 0; cursor: pointer; transition: transform .16s var(--ease); -webkit-tap-highlight-color: transparent; }
  #choice i { width: 20px; height: 74px; background: var(--c); border-radius: 2px 2px 9px 3px; box-shadow: 0 0 0 1px rgba(10,30,60,.45), 0 2px 8px rgba(0,0,0,.45); transform: skewX(-4deg); }
  #choice span { font: 400 14px var(--serif); color: #fff; text-shadow: 0 0 8px rgba(0,20,50,.95); opacity: 0; white-space: nowrap; }
  #choice .on { transform: translateY(-9px); }
  #choice .on i { box-shadow: 0 0 0 1.5px #eaf8ff, 0 0 14px rgba(var(--glow),.95); }
  #choice .on span { opacity: 1; }
  #choice .x { display: none; width: 44px; height: 44px; margin-top: 14px; border-radius: 50%; align-items: center; justify-content: center; color: #fff; font-size: 16px; background: rgba(18,46,76,.74); box-shadow: 0 0 0 1px rgba(255,255,255,.55); }
  @media (pointer: coarse) { #choice { gap: 10px; } #choice button { width: 72px; } #choice span { opacity: 1; } #choice .x { display: flex; } }

  /* ---- the inspect stage (docs/ui.md): the thing is the live view (src/ui/stage.js); its type is a glass pane beside it ---- */
  #dip { position: fixed; inset: 0; z-index: 9; background: #05090e; opacity: 0; pointer-events: none; transition: opacity .13s linear; }
  #dip.on { opacity: 1; }
  #card { z-index: 10; --free-r: 40vw; --free-b: 40vh; }
  #card.show { display: block; }
  .st-orbit { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  .k-photo .st-orbit { background: rgba(5,11,18,.95); cursor: default; }
  .st-hero { position: absolute; left: 0; top: 0; width: calc(100% - var(--free-r)); height: 100%; padding: 4vmin; object-fit: contain; cursor: zoom-in; }
  .st-col { position: absolute; right: 22px; top: 22px; bottom: 22px; width: 410px; zoom: var(--ui); display: flex; flex-direction: column; justify-content: center; pointer-events: none; }
  .st-pane { pointer-events: auto; display: flex; flex-direction: column; min-height: 0; max-height: 100%; }
  .st-head { display: block; padding: 13px 62px 9px 12px; }
  .stage .cat { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--live-l); }
  .stage h2 { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1.08; margin: 3px 0 4px; color: #fff; overflow-wrap: anywhere; }
  .stage .sub { color: var(--dim); font-family: var(--serif); font-style: italic; font-size: 14px; }
  .stage .sub .ru { font-style: normal; }
  .stage .sub .more { display: block; font-style: normal; color: #fff; margin-bottom: 2px; }
  .st-body { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px 12px 10px; scrollbar-width: none; }
  .st-body::-webkit-scrollbar { display: none; }
  .st-show .lead { margin: 0; font-size: 16px; line-height: 1.5; color: #fff; text-shadow: 0 1px 3px rgba(0,8,20,.7); }
  .say { font-family: var(--serif); font-style: italic; }
  .st-show .say { margin: 10px 0 0; padding-left: 11px; border-left: 2px solid #f6c56a; color: #ffe9c2; font-size: 14.5px; line-height: 1.45; }
  .client .say { color: #6b4a12; }
  .st-strip { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 3px 12px 10px; scrollbar-width: none; }
  .st-strip::-webkit-scrollbar { display: none; }
  .st-strip button { flex: none; width: 78px; aspect-ratio: 4 / 3; padding: 0; border-radius: 4px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,.7); background: #1a2632; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .st-strip img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .st-strip button.on { border-color: #fff; box-shadow: 0 0 0 2px #fff; }
  .st-strip button.vh, .st-strip button:hover { border-color: var(--live-l); box-shadow: 0 0 8px rgba(var(--glow),.8); }
  .st-fig { display: none; margin: 0 0 4px; }
  .pic .st-fig, .k-photo .st-fig { display: block; }
  .st-fig .hero { display: block; max-width: 100%; padding: 0; border: 1px solid rgba(255,255,255,.65); background: #1a2632; cursor: zoom-in; }
  .st-fig .hero img { display: block; width: auto; height: auto; max-width: 100%; max-height: 40vh; }
  .st-fig figcaption { margin-top: 7px; font-size: 13px; line-height: 1.45; color: #fff; }
  .pic .st-show .lead, .pic .st-show .say { display: none; }
  .k-photo .st-show .lead { margin-top: 10px; }
  .st-read { display: none; min-height: 0; flex: 0 1 auto; }
  .read .st-read { display: flex; }
  .read .st-body, .read .st-strip { display: none; }
  .st-read .client { max-height: min(56vh, 620px); }
  .st-go { flex: none; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 2px 1px; }
  .st-go .btn.primary { font-size: 15px; padding: 8px 20px 8px 10px; min-height: 40px; display: inline-flex; align-items: center; gap: 9px; }
  .st-go kbd { box-shadow: none; }
  /* the names of the things round it, on their places */
  .st-marks { position: absolute; left: 0; top: 0; }
  .st-mark { position: absolute; left: 0; top: 0; display: none; align-items: center; gap: 7px; margin: -10px 0 0 -6px; padding: 2px 10px 2px 0; border: 0; background: none; cursor: pointer; white-space: nowrap; will-change: transform;
    color: #fff; font: 600 13px var(--sans); text-shadow: 0 1px 2px rgba(0,8,20,.95), 0 0 10px rgba(0,8,20,.85); }
  .st-mark.on { display: flex; }
  .st-mark i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; background: #2a8ae0; }
  .st-mark.vh, .st-mark:hover { color: var(--live-l); }
  @media (orientation: portrait) {
    .st-hero { width: 100%; height: calc(100% - var(--free-b)); padding: 20px 12px 8px; }
    .st-col { left: 8px; right: 8px; top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); width: auto; max-height: 64vh; justify-content: flex-end; }
    .stage h2 { font-size: clamp(28px, 9vw, 44px); }
    .st-show .lead { font-size: 15.5px; line-height: 1.45; }
    .st-read .client { max-height: 44vh; }
    .st-fig .hero img { max-height: 25vh; }
    .st-go .btn.primary { flex: 1; justify-content: center; min-height: 46px; }
  }
  @media (orientation: landscape) and (max-height: 520px) {
    .st-col { top: 6px; bottom: 6px; right: max(8px, env(safe-area-inset-right)); width: 46vw; }
    .st-head { padding-top: 9px; padding-bottom: 5px; }
    .stage h2 { font-size: 27px; margin: 1px 0; }
    .st-show .lead { font-size: 14px; line-height: 1.4; }
    .st-strip button { width: 58px; }
    .st-strip { padding-bottom: 6px; }
    .st-read .client { max-height: none; }
    .st-fig .hero img { max-height: 34vh; }
    .st-go { padding-top: 5px; }
  }
  /* the drawn cursor */
  #vcursor { position: fixed; z-index: 40; left: 0; top: 0; display: none; pointer-events: none; will-change: transform; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); }
  #vcursor.on { display: block; }
  #vcursor svg { display: block; }
  #vcursor.hand svg { margin-left: -8px; }
  .client h3 { font-weight: 600; font-size: 17px; margin: 2px 0 6px; color: var(--c-head); line-height: 1.35; }
  .client .lead { font-weight: 600; color: #22364b; }
  .client p { margin: 8px 0; }
  .facts { padding-left: 18px; margin: 12px 0; color: var(--c-dim); }
  .facts li { margin: 4px 0; }
  .facts li::marker { color: var(--live); }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 6px; }
  .rel > span { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--c-dim); margin-right: 4px; }
  .chip { font-family: var(--serif); font-size: 13.5px; padding: 3px 13px; }
  .chip.unknown { color: #8a99a8; cursor: default; border-style: dashed; background: #f3f6f9; box-shadow: none; }
  .chip.told { border-style: dashed; } /* told of only in cards: following the link finds it */
  .src { margin-top: 10px; font-size: 12px; color: var(--c-dim); }
  .src summary { cursor: pointer; color: var(--live-d); }
  .src a { display: block; color: var(--live-d); word-break: break-all; }
  .credit { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .credit a { color: var(--live-l); text-decoration: none; }
  .credit a:hover, .credit a.vh, .src a.vh, .src summary.vh { text-decoration: underline; }
  #lightbox { z-index: 30; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: rgba(4,9,15,.95); cursor: zoom-out; }
  #lightbox img { display: block; max-width: 100%; max-height: calc(100% - 76px); object-fit: contain; border: 1px solid rgba(255,255,255,.6); }
  #lightbox .cap { max-width: 760px; font-size: 13.5px; line-height: 1.45; color: #fff; text-align: center; }

  /* ---- journal (docs/ui.md, src/ui/journal.js): a glass window with three leaves: the map, the finds, the work ---- */
  #journal { z-index: 10; align-items: stretch; justify-content: center; padding: 2.4vh 2.4vw; background: rgba(4,12,22,.5); }
  .jw { zoom: var(--ui); flex: 1; min-width: 0; max-width: 1500px; }
  .jw .win-head { padding-right: 70px; flex-wrap: wrap; gap: 6px 14px; }
  .j-count { display: flex; gap: 9px; align-items: center; font-size: 14px; color: var(--dim); }
  .j-count b { color: #fff; font-weight: 600; font-size: 1.2em; }
  .j-count .bar { width: 110px; height: 10px; border-radius: 5px; }
  .j-count .bar i { transition: none; }
  .j-lang { margin-left: auto; }
  .j-tabs { flex: none; display: flex; justify-content: center; gap: 6px; padding: 0 2px; }
  .j-tabs button { flex: 0 1 190px; display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 6px 12px; margin-bottom: -1px; cursor: pointer;
    font: 600 15px var(--sans); color: #fff; text-shadow: 0 1px 2px rgba(0,20,50,.8); border: 1px solid rgba(255,255,255,.45); border-bottom: 0; border-radius: 9px 9px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.3) 0, rgba(255,255,255,.08) 100%), rgba(10,34,60,.55); }
  .j-tabs button .ic { width: 21px; height: 21px; }
  .j-tabs button:hover, .j-tabs button.vh { border-color: #fff; }
  .j-tabs button.on { color: var(--c-head); text-shadow: none; border-color: #fff; background: linear-gradient(180deg, #fff, #eef4fa); }
  .j-body { position: relative; flex: 1; min-height: 0; border: 1px solid rgba(10,30,60,.55); box-shadow: 0 0 0 1px rgba(255,255,255,.35); overflow: hidden; background: #16324c; }
  .j-leaf { position: absolute; inset: 0; display: none; }
  .j-leaf.on { display: block; }
  .j-list { border: 0; border-radius: 0; box-shadow: none; padding: 12px 14px 16px; }
  .j-list h4 { margin: 16px 0 7px; font-size: 11.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--c-head); }
  .j-list h4:first-child { margin-top: 0; }
  .jg { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .jg.work { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .jt { position: relative; aspect-ratio: 1; padding: 0; overflow: hidden; cursor: pointer; border: 1px solid #5f7a98; border-radius: 5px; background: #16222e; color: #fff; text-align: left; font: inherit; box-shadow: 0 1px 3px rgba(0,20,50,.35); }
  .jt.job { aspect-ratio: 4 / 3; }
  .jt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .jt b { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font: 400 14.5px/1.2 var(--serif); overflow-wrap: anywhere; background: linear-gradient(180deg, rgba(5,11,18,0), rgba(5,11,18,.85) 55%); }
  .jt b small, .j-name small { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 3px; font: 600 13px/1.3 var(--sans); color: #dff4c8; }
  .jt b small span, .j-name small span { display: inline-flex; align-items: center; gap: 4px; }
  .jt b small .ic, .j-name small .ic { width: 15px; height: 15px; }
  .jt.q img { opacity: .5; }
  .jt.q i { position: absolute; inset: 0; display: grid; place-items: center; font: 400 28px var(--serif); color: rgba(255,255,255,.85); }
  .jt.job.q b { color: var(--dim); }
  .jt.vh, .jt:hover { border-color: #fff; box-shadow: 0 0 9px rgba(var(--glow),.9); }
  /* the map: one layer dragged and scaled (`--k` = 1 / scale keeps markers and lines their size) */
  .j-map { touch-action: none; cursor: grab; overflow: hidden; background: #16324c; user-select: none; -webkit-user-select: none; }
  .j-world { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; transform-origin: 0 0; will-change: transform; --k: 1; }
  .j-world img, .j-world svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .m-house { fill: #fff6e2; stroke: #4a3a26; stroke-width: calc(2px * var(--k)); }
  .m-pen { fill: none; stroke: #4a3a26; stroke-width: calc(1.6px * var(--k)); stroke-dasharray: calc(5px * var(--k)) calc(4px * var(--k)); }
  .m-post, .m-dot { fill: #4a3a26; }
  .m-tree { fill: rgba(72,128,60,.75); stroke: #fff; stroke-width: calc(1.6px * var(--k)); }
  .j-pins { position: absolute; inset: 0; }
  .j-pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; transform: scale(var(--k));
    border: 2px solid #fff; background: #2a8ae0; color: #3a2400; font: 700 12px/1 var(--sans); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .j-pin::before { content: ''; position: absolute; inset: -11px; } /* a thumb's worth */
  .j-pin.q { background: rgba(20,30,44,.72); border-color: var(--gold); color: var(--gold); }
  .j-pin.job { width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 6px; background: linear-gradient(180deg, #8fdc6f, #3a9c1c); color: #fff; }
  .j-pin.job .ic { width: 16px; height: 16px; stroke-width: 2.4; }
  .j-pin span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap; pointer-events: none; font: 400 14px/1.1 var(--serif); color: #2a1c08; text-shadow: 0 0 3px #fff6e2, 0 0 3px #fff6e2, 0 0 6px #fff6e2; }
  .j-pin.off { display: none; }
  .j-pin.on { z-index: 2; box-shadow: 0 0 0 3px #fff, 0 0 12px 4px rgba(var(--glow),.95); }
  .j-pin.vh, .j-pin:hover { z-index: 3; box-shadow: 0 0 0 3px rgba(255,255,255,.75); }
  .j-pin.dest { display: none; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 2px; pointer-events: none; z-index: 4; background: var(--gold); border: 2px solid #7a5210; transform: scale(var(--k)) rotate(45deg); box-shadow: 0 0 10px 3px rgba(255,200,90,.9); }
  .j-pin.dest.on { display: block; }
  .j-pin.me { width: 0; height: 0; margin: 0; border: 0; background: none; box-shadow: none; pointer-events: none; z-index: 5; transform: scale(var(--k)) rotate(var(--r, 0rad)); }
  .j-pin.me::before { content: ''; position: absolute; inset: auto; left: -11px; top: -15px; width: 22px; height: 26px; background: #fff; clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%); }
  .j-pin.me::after { content: ''; position: absolute; left: -8px; top: -10.5px; width: 16px; height: 19px; background: #e8452c; clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%); }
  .j-ctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .j-ctl button, .j-do { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; cursor: pointer; border-radius: 9px; color: #12263c; border: 1px solid #6f8aa8;
    background: linear-gradient(180deg, #fdfeff 0%, #eef4fa 48%, #dbe6f1 52%, #e9f1f9 100%); box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(0,20,50,.4); }
  .j-ctl button:hover, .j-ctl button.vh, .j-do:hover, .j-do.vh { border-color: #3c7fb1; box-shadow: inset 0 1px 0 #fff, 0 0 9px rgba(var(--glow),.85); }
  .j-ctl .ic { width: 22px; height: 22px; }
  /* the chosen marker: what it is, look closer (blue), be led there (gold) */
  .j-sel { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; max-width: calc(100% - 20px); }
  .j-sel.on { display: flex; }
  .j-thumb { position: relative; flex: none; width: 54px; height: 54px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,.7); background: #16222e; }
  .j-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .j-name { min-width: 0; padding-right: 6px; }
  .j-name b { display: block; font: 400 19px/1.2 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .j-name > small { color: var(--dim); font-weight: 500; }
  .j-do { flex: none; width: 52px; height: 52px; border-radius: 50%; }
  .j-do.read { color: #fff; border-color: rgba(255,255,255,.8); background: linear-gradient(180deg, rgba(255,255,255,.5) 0, rgba(255,255,255,.12) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.16) 100%), rgb(var(--read)); }
  .j-do.read .ic { width: 26px; height: 26px; }
  .j-do.go { width: auto; padding: 0 14px 0 16px; display: flex; gap: 10px; border-radius: 26px; color: #3a2400; border-color: #a8741c; background: linear-gradient(180deg, #fff3d0 0%, #ffd77a 48%, #f3b94a 52%, #ffd27a 100%); }
  .j-do.go .ic { width: 24px; height: 24px; }
  .j-do.go.on { background: linear-gradient(180deg, #d9a23c, #f3c463); box-shadow: inset 0 2px 5px rgba(80,40,0,.5); }
  @media (max-width: 700px), (max-height: 520px) {
    #journal { padding: 0; }
    .jw { border-radius: 0; border-width: 0; padding: env(safe-area-inset-top) max(5px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(5px, env(safe-area-inset-left)); }
    .jw .win-head h2 { font-size: 21px; }
    .j-lang { display: none; }
    .j-count .bar { width: 64px; }
    .j-tabs button { flex: 1; }
    .jg { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .jg.work { grid-template-columns: repeat(2, 1fr); }
    .j-list { padding: 10px 8px 14px; }
  }
  @media (max-height: 520px) {
    .jw .win-head { padding-top: 6px; padding-bottom: 5px; }
    .j-tabs { position: absolute; left: 220px; right: 84px; top: 5px; z-index: 2; }
    .j-tabs button { min-height: 36px; border-bottom: 1px solid rgba(255,255,255,.45); border-radius: 8px; }
    .j-count .bar { display: none; }
    .jg { grid-template-columns: repeat(6, 1fr); } .jg.work { grid-template-columns: repeat(4, 1fr); }
  }
  /* the finder's marker: a small gold diamond over the place, or at the screen edge with an arrow */
  .gmark { display: inline-block; width: 10px; height: 10px; flex: none; transform: rotate(45deg); background: var(--gold); border: 1px solid #a8741c; }
  #guide { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; display: none; will-change: transform; }
  #guide.on { display: block; }
  #guide > * { zoom: var(--ui); }
  #guide .pin { position: absolute; left: -9px; top: -9px; width: 16px; height: 16px; transform: rotate(45deg); background: rgba(255,215,120,.9); border: 1px solid rgba(120,80,20,.8); box-shadow: 0 0 10px rgba(255,200,90,.85); animation: gpulse 2.4s ease-in-out infinite; }
  #guide .arrow { display: none; position: absolute; left: -9px; top: -9px; width: 0; height: 0; border-left: 17px solid #ffd77a; border-top: 9px solid transparent; border-bottom: 9px solid transparent; transform-origin: 9px 9px; transform: rotate(var(--a)) translateX(19px); }
  #guide.edge .arrow { display: block; }
  #guide .dist { position: absolute; left: 0; top: 14px; transform: translateX(-50%); font-size: 13px; font-weight: 600; white-space: nowrap; color: #fff3d6; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  #gshimmer { position: fixed; left: -60px; top: -60px; width: 120px; height: 120px; z-index: 3; pointer-events: none; display: none; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,180,.35) 0, rgba(255,220,140,.14) 35%, rgba(255,220,140,0) 70%); mix-blend-mode: screen; }
  #gshimmer.on { display: block; }
  #gshimmer::after { content: ''; position: absolute; inset: 25%; border-radius: 50%; border: 1px solid rgba(255,230,170,.55); animation: gring 1.8s ease-out infinite; }
  @keyframes gpulse { 50% { opacity: .55; } }
  @keyframes gring { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }

  /* ---- beats (docs/ui.md): a found thing's picture and name by the journal's corner; a saying as a caption ---- */
  #toasts { position: fixed; z-index: 25; right: calc(18px + env(safe-area-inset-right)); top: calc(16px + env(safe-area-inset-top)); zoom: var(--ui); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; color: #fff; transition: opacity .6s; }
  .toast.found { padding: 4px 4px 4px 16px; border-radius: 999px; }
  .toast img { width: 46px; height: 46px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #16222e; }
  .toast b { font: 400 19px/1.2 var(--serif); text-shadow: 0 1px 2px rgba(0,8,20,.8); }
  .toast small { font-size: 12.5px; color: var(--dim); }
  .toast.say { position: fixed; left: 50%; bottom: 15%; transform: translateX(-50%); width: max-content; max-width: min(600px, 92vw); flex-direction: column; gap: 3px; text-align: center; padding: 10px 22px 11px; }
  .toast.say b { font-style: italic; font-size: 19px; line-height: 1.35; color: #ffe9c2; }
  .toast.out { opacity: 0; }

  /* ---- pause (docs/ui.md): a glass window; what can be done on the left, the chosen page on the right
     (a phone: one at a time, with a way back) ---- */
  #pause { z-index: 20; align-items: center; justify-content: center; background: rgba(4,12,22,.45); cursor: pointer; padding: 16px; animation: fadein .25s both; }
  .menu { zoom: var(--ui); width: min(760px, 100%); height: min(560px, 100%); cursor: default; animation: pop .4s var(--ease) both; }
  .menu .win-head .ver { margin-left: auto; padding-right: 64px; font-size: 12px; color: var(--dim); }
  .pz { flex: 1; min-height: 0; display: flex; gap: 7px; }
  .pz-nav { flex: none; width: 226px; display: flex; flex-direction: column; gap: 7px; padding: 4px 1px 2px; }
  .pz-nav button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 8px; cursor: pointer; text-align: left;
    font: 600 15px var(--sans); color: #fff; text-shadow: 0 1px 2px rgba(0,20,50,.8); border: 1px solid rgba(255,255,255,.45);
    background: linear-gradient(180deg, rgba(255,255,255,.3) 0, rgba(255,255,255,.1) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.08) 100%), rgba(10,34,60,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 1px 3px rgba(0,0,0,.3); }
  .pz-nav button .ic { width: 22px; height: 22px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 170px; height: 24px; background: transparent; cursor: pointer; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(180deg, #b9c6d3, #e8eef3); border: 1px solid #8c9dae; box-shadow: inset 0 1px 1px rgba(0,0,0,.18); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(180deg, #b9c6d3, #e8eef3); border: 1px solid #8c9dae; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 19px; height: 19px; margin-top: -8px; border-radius: 50%; border: 1px solid #2f659c;
    background: radial-gradient(circle at 50% 28%, #fff 0, #d6ecfc 34%, #6db4ea 70%, #3e8fd2 100%); box-shadow: 0 1px 3px rgba(0,20,50,.45), inset 0 1px 0 #fff; }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #2f659c; background: radial-gradient(circle at 50% 28%, #fff 0, #d6ecfc 34%, #6db4ea 70%, #3e8fd2 100%); }
  /* a switch: off grey, on green */
  input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: none; width: 46px; height: 26px; margin: 0; border: 1px solid #7a8b9c; border-radius: 13px; cursor: pointer; position: relative;
    background: linear-gradient(180deg, #c3ccd6, #e4e9ee); box-shadow: inset 0 1px 3px rgba(0,20,50,.3); }
  input[type=checkbox]::after { content: ''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #6f8aa8; background: linear-gradient(180deg, #fff, #dbe6f1); box-shadow: 0 1px 2px rgba(0,20,50,.4); transition: transform .15s; }
  input[type=checkbox]:checked { border-color: #2c7a12; background: linear-gradient(180deg, #4aa827, #7fd45a); }
  input[type=checkbox]:checked::after { transform: translateX(20px); }
  .qnote { color: #8a5a10; font-size: 13px; background: #fff6e2; border: 1px solid #f0d49a; margin-top: 4px; }
  .qnote[hidden] { display: none; }
  /* the controls, drawn: its key (or the touch control) and what it does */
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; font-size: 14px; color: var(--c-ink); align-items: center; padding: 4px 6px; }
  .keys > :nth-child(odd) { justify-self: end; display: flex; gap: 4px; align-items: center; }
  .keys .tbtn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 1px solid rgba(0,30,60,.5); background: linear-gradient(180deg, #7fa3c6, #47698c); }
  .keys .tbtn.do { background: linear-gradient(180deg, #8fdc6f, #3a9c1c); } .keys .tbtn.read { background: linear-gradient(180deg, #8ccdf7, #1f78c8); }
  .keys .tbtn .ic { width: 18px; height: 18px; }
  .about { display: flex; flex-direction: column; gap: 12px; color: var(--c-ink); }

  .about .btn.issue { color: #3a2400; border-color: #b9761a; background: linear-gradient(180deg, #ffe7b8 0%, #f9c56a 48%, #f0a83a 52%, #f7c160 100%); }
  .about small { color: var(--c-dim); font-size: 12px; line-height: 1.5; }
  @media (max-width: 700px) {
    #pause { padding: calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)); }
    .menu { height: auto; max-height: 100%; }
    .pz { flex-direction: column; }
    .pz-nav { width: auto; gap: 9px; padding-bottom: 4px; }

    .pz-nav #resume { min-height: 66px; font-size: 19px; }

    .pz-nav button.on { color: #fff; text-shadow: 0 1px 2px rgba(0,20,50,.8); border-color: rgba(255,255,255,.45); background: linear-gradient(180deg, rgba(255,255,255,.3) 0, rgba(255,255,255,.1) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.08) 100%), rgba(10,34,60,.55); }

  /* ---- lessons (src/ui/teach.js): one control at a time, drawn; top centre, on a phone top left ---- */
  #teach { position: fixed; z-index: 6; left: 50%; top: 7%; transform: translateX(-50%); zoom: calc(var(--ui) * 1.25); display: none; align-items: center; gap: 14px; padding: 10px 18px 10px 14px; pointer-events: none; }
  #teach.on { display: flex; }
  #teach.t-turn { z-index: 11; }
  #teach.touch { left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); transform: none; zoom: 1; padding: 8px 14px 8px 10px; gap: 10px; }
  .t-art { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .t-art kbd { font-size: 18px; padding: 5px 0; min-width: 36px; border-radius: 7px; }
  .t-art .lit, .t-art .tap, .t-press { animation: t-key 1.2s ease-in-out infinite; }
  .t-art .mouse { width: 26px; height: 38px; color: #fff; }
  .t-art .ic { width: 30px; height: 30px; }
  .t-say { font: 600 17px var(--sans); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,8,20,.8); }
  .t-say:empty { display: none; }
  .t-wasd { display: grid; grid-template-columns: repeat(3, 36px); gap: 3px; }
  .t-wasd kbd:first-child { grid-column: 2; }
  .t-wasd kbd:nth-child(2) { grid-column: 1; }
  .t-sway { display: inline-flex; animation: t-sway 1.6s ease-in-out infinite; }
  .t-press { display: inline-flex; }
  .t-arr { width: 0; height: 0; border: 6px solid transparent; }
  .t-arr.l { border-right-color: #fff; } .t-arr.r { border-left-color: #fff; }
  .t-stick { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff; }
  .t-stick i { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: #fff; animation: t-push 1.6s ease-in-out infinite; }
  .t-aim { position: relative; width: 86px; height: 40px; }
  .t-aim .thing { position: absolute; right: 2px; top: 5px; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 7px; }
  .t-aim .dot { position: absolute; left: 0; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: t-aim 2s ease-in-out infinite; }
  .t-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.75);
    background: linear-gradient(180deg, rgba(255,255,255,.45) 0, rgba(255,255,255,.12) 48%, rgba(255,255,255,0) 52%, rgba(255,255,255,.14) 100%), rgb(34,70,106); }
  .t-btn.sq { border-radius: 12px; }
  .t-btn.read { background-color: rgb(var(--read)); }
  .t-btn.do { background-color: rgb(58,156,28); }
  .t-btn .ic { width: 24px; height: 24px; }
  .t-hold { width: 24px; height: 6px; border-radius: 3px; background: #fff; }
  #teach-ghost { position: fixed; z-index: 6; left: 50%; top: 40%; width: 0; height: 0; display: none; pointer-events: none; color: #fff; filter: drop-shadow(0 2px 5px rgba(0,10,30,.7)); }
  #teach-ghost.on { display: block; animation: t-slide 2.2s ease-in-out infinite; }
  #teach-ghost.g-turn { top: 30%; z-index: 11; }
  #teach-ghost .ic { position: absolute; left: -22px; top: -8px; width: 64px; height: 64px; stroke-width: 1.4; fill: rgba(255,255,255,.25); }
  #teach-ghost i { position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.3); }
  @keyframes t-slide { 0%, 100% { transform: translateX(-27vw); } 50% { transform: translateX(27vw); } }
  @keyframes t-key { 0%, 100% { transform: none; } 50% { transform: translateY(3px) scale(.93); } }
  @keyframes t-sway { 0%, 100% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }
  @keyframes t-push { 0%, 100% { transform: none; } 50% { transform: translateY(-11px); } }
  @keyframes t-aim { 0%, 15% { transform: none; } 60%, 100% { transform: translate(61px, 0) scale(1.6); } }

  /* ---- F3 meter ---- */
  #fps { position: fixed; z-index: 26; left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); font: 11px/1.45 ui-monospace, Menlo, monospace; color: #e8f6ff; display: none; pointer-events: none; white-space: pre; padding: 6px 10px; border-radius: 6px; background: rgba(5,11,18,.6); text-shadow: 0 1px 2px #000; }
  #fps.on { display: block; }

  /* ---- loading key art: the game's own render over the world until it is complete, then a cross-fade (docs/loading.md) ---- */
  #keyart { position: fixed; inset: 0; z-index: 15; overflow: hidden; pointer-events: none; transition: opacity 1.4s ease-in-out;
    background: #8fa7b8 /* keyart-lqip */ url(data:image/webp;base64,UklGRrgAAABXRUJQVlA4IKwAAACwBgCdASowABsAPrVSok0nJKMiJWsw4BaJZAC4UV4J/gvAl9DDPImy8/McoWT8GSqsITPARv63LI6sFcpFIAD+77wrQvaTCXbLzOCyagcTKF0Rf6CFAg8dy18aDFATPd20ZN4TGoPpsmDSmN74m2PIwD0PU3JzIiQ6QQSmiQcDxGmTQmrm3bIdsddflnZA/70w3kplpVIZokr2WvHraORDJG/T3uMDdEzVxgAA) center / cover no-repeat; }
  #keyart img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; transform-origin: 50% 40%; will-change: transform; animation: kenburns 46s ease-in-out infinite alternate; }
  #keyart img.in { opacity: 1; }
  #keyart.gone { opacity: 0; }
  .auto #keyart { display: none; }
  @keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.09) translate3d(-1%, -.8%, 0); } }

  /* src/ui/prewarm.js: every surface drawn once while loading, under the key art (which must not count as opaque:
     what an opaque layer hides is not drawn); with no key art (?auto), all but unseen instead */
  .prewarm :is(#dot, #prompt, #puthint, #choice, #toasts, #dip, #card, #journal, #lightbox, #pause, #teach, #teach-ghost, #fps, #guide, #gshimmer, #vcursor, .tc-root) { pointer-events: none !important; z-index: 1 !important; }
  .prewarm #keyart { opacity: .999; transition: none; }
  .prewarm.bare :is(#dot, #prompt, #puthint, #choice, #toasts, #dip, #card, #journal, #lightbox, #pause, #teach, #teach-ghost, #fps, #guide, #gshimmer, #vcursor, .tc-root) { opacity: .01 !important; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 2.4s ease; pointer-events: none; }
  #fade.clear { opacity: 0; }

  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  @keyframes fadein { from { opacity: 0; } }

  /* touch: thumb-sized targets, no keyboard glyphs */
  @media (pointer: coarse) {
    #toasts { top: calc(68px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }

    @media (orientation: landscape) { .toast.say { top: calc(8px + env(safe-area-inset-top)); max-width: 42vw; padding: 6px 16px 7px; } .toast.say b { font-size: 16px; } }
    .btn, .chip, .sel-btn, .sel-menu button { min-height: 44px; }
    .sel-menu button { font-size: 15px; }
    .settings .row { min-height: 50px; }
    input[type=range] { height: 44px; }
    .win-close { width: 56px; height: 34px; right: 8px; }
    .kb { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
